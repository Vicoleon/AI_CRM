[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["I", "E", "F", "B", "UP", "C4", "SIM", "TID"]
ignore = [
    "E501", # line-too-long
    "B008", # function-call-in-default-argument (FastAPI Depends)
    "E701", # multiple-statements-on-one-line-colon
    "E402", # module-import-not-at-top-of-file
    "B904", # raise-without-from-inside-except
    "SIM",  # Simplify (too many existing cases)
    "C4",   # Comprehensions (too many existing cases)
    "B905", # zip(..., strict=True) (too many existing cases)
    "F841", # unused-variable (too many existing cases)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
